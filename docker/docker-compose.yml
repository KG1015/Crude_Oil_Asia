version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: crude_battleground_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/asian_crude_battleground
    depends_on:
      - mongo
    networks:
      - crude_network

  mongo:
    image: mongo:7.0
    container_name: crude_battleground_db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - crude_network

networks:
  crude_network:
    driver: bridge

volumes:
  mongo_data:
